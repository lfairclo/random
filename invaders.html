<script>
/* Show real errors on the page instead of a bare "Script error." */
window.showFatal = function (title, detail) {
  var box = document.getElementById("fatal");
  if (!box) {
    box = document.createElement("div"); box.id = "fatal";
    box.style.cssText = "position:fixed;z-index:99;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:460px;padding:14px 16px;border-radius:14px;background:#2a1020;color:#fff;font:14px/1.45 -apple-system,system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)";
    (document.body || document.documentElement).appendChild(box);
  }
  box.innerHTML = "<b style='display:block;margin-bottom:4px'></b><span></span>";
  box.firstChild.textContent = title; box.lastChild.textContent = detail || "";
};
window.addEventListener("error", function (e) {
  if (e.target && e.target !== window && (e.target.src || e.target.href)) return; // resource errors handled by the loader
  showFatal("Something went wrong", (e.message || "Unknown error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
}, true);
window.addEventListener("unhandledrejection", function (e) { showFatal("Something went wrong", String(e.reason && e.reason.message || e.reason)); });
</script>

<style>
:root{
  --pixel:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --bg:#f6f5fb; --glass:rgba(250,249,255,.82); --ink:#1d1a2b; --ink-2:#6a6680; --line:rgba(29,26,43,.12);
  --pink:#e0218a; --amber:#f0a202; --slate:#8b8a97; --violet:#7a5af5; --fog:#b5b3c2;
  --apple:#007aff; --ok-chip:#fde3f1;
  --shadow:0 6px 24px rgba(30,20,60,.18),0 1px 3px rgba(30,20,60,.12);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16141f; --glass:rgba(30,27,42,.84); --ink:#f2f0fa; --ink-2:#a19cb8; --line:rgba(255,255,255,.12);
    --ok-chip:#4a1733; --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4); color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--apple);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--shadow)}

/* top search */
#top{position:fixed;z-index:5;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 10px);right:calc(var(--sar) + 66px);max-width:440px}
#searchbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px}
#searchbar .brand{font-family:var(--pixel);font-size:18px;line-height:1}
#q{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
#q::placeholder{color:var(--ink-2)}
#qclear{display:none;width:28px;height:28px;border-radius:50%;color:var(--ink-2);font-size:18px}
#results{margin-top:8px;border-radius:14px;max-height:min(60vh,460px);overflow:auto;display:none;overscroll-behavior:contain}
#results.open{display:block}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover,.row.active{background:rgba(127,127,160,.12)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--ink-2);font-size:13px}
.row .n{font-family:var(--pixel);font-size:13px;color:var(--ink-2)}
.row .ico{width:30px;height:24px;flex:none;image-rendering:pixelated}
.sect{padding:10px 14px 4px;font-size:12px;color:var(--ink-2);font-weight:600}

/* right controls */
#controls{position:fixed;z-index:5;top:calc(var(--sat) + 10px);right:calc(var(--sar) + 10px);display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.stack button{width:46px;height:46px;display:grid;place-items:center}
.stack button+button{border-top:1px solid var(--line)}
.stack svg{width:22px;height:22px}
#locate{color:var(--apple)}
#locate.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
#toast{position:fixed;z-index:9;left:50%;top:calc(var(--sat) + 70px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* bottom sheet */
#sheet{position:fixed;z-index:6;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);bottom:0;max-width:460px;
  border-radius:20px 20px 0 0;padding:8px 18px calc(var(--sab) + 16px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:72vh;overflow:auto;overscroll-behavior:contain}
#sheet.open{transform:none}
@media (min-width:700px){#sheet{left:calc(var(--sal) + 10px);bottom:calc(var(--sab) + 10px);border-radius:20px;width:400px}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:14px}
.sh-head canvas{width:55px;height:40px;image-rendering:pixelated;flex:none}
.sh-head h2{margin:0;font-family:var(--pixel);font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1.1}
.sh-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.sh-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(127,127,160,.16);font-size:16px;flex:none;align-self:flex-start}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:rgba(127,127,160,.13);font-size:13px;font-weight:600}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.hint{margin:0 0 14px;font-size:15px;line-height:1.45}
.actions{display:flex;gap:10px}
.btn{flex:1;height:46px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit}
.btn.primary{background:var(--pink);color:#fff}
.btn.primary.done{background:rgba(127,127,160,.2);color:var(--ink)}
.btn.ghost{background:rgba(127,127,160,.16)}
.sh-title{margin:0 0 4px;font-size:20px;font-weight:700}
.sh-sub{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.near{list-style:none;margin:0 -18px;padding:0}
.near li button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 18px;text-align:left}
.near li button:hover{background:rgba(127,127,160,.1)}
.near .arrow{width:26px;height:26px;color:var(--apple);flex:none}
.near .d{margin-left:auto;font-family:var(--pixel);font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:rgba(127,127,160,.15);margin-bottom:16px}
.seg button{height:36px;border-radius:9px;font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.tog input{appearance:none;width:50px;height:30px;border-radius:15px;background:rgba(127,127,160,.35);position:relative;transition:.2s;cursor:pointer;flex:none}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.tog input:checked{background:#34c759}
.tog input:checked::after{transform:translateX(20px)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:16px 0}
.legend span{display:flex;align-items:center;gap:8px;font-size:14px}
.legend canvas{width:30px;height:22px;image-rendering:pixelated}
.progress{margin:6px 0 16px}
.progress .big{font-family:var(--pixel);font-size:30px;font-weight:700}
.bar{height:8px;border-radius:4px;background:rgba(127,127,160,.2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:4px}
.small{color:var(--ink-2);font-size:12.5px;line-height:1.5}
.small a{color:inherit}

/* clusters */
.cl{display:grid;place-items:center;font-family:var(--pixel);font-weight:700;color:#fff;background:var(--pink);border-radius:7px;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 3px 10px rgba(0,0,0,.3);cursor:pointer;line-height:1;transition:transform .15s}
.cl:hover{transform:scale(1.08)}
.cl.mostly-gone{background:var(--slate)}

/* the blue dot */
.me{width:24px;height:24px;position:relative;pointer-events:none}
.me-dot{position:absolute;inset:3px;border-radius:50%;background:var(--apple);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);z-index:3}
.me-halo{position:absolute;inset:3px;border-radius:50%;background:var(--apple);opacity:.35;animation:halo 2.2s ease-out infinite;z-index:1}
.me-cone{position:absolute;left:50%;bottom:50%;width:74px;height:62px;margin-left:-37px;transform-origin:50% 100%;z-index:2;display:none;
  background:radial-gradient(ellipse 50% 100% at 50% 100%,rgba(0,122,255,.55),rgba(0,122,255,.18) 60%,rgba(0,122,255,0) 100%);
  clip-path:polygon(50% 100%,6% 0,94% 0)}
.me.has-heading .me-cone{display:block}
.me.stale .me-dot{background:#8e8e93}
.me.stale .me-halo{display:none}
@keyframes halo{0%{transform:scale(1);opacity:.4}100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.me-halo{animation:none;opacity:.15;transform:scale(1.8)}#sheet{transition:none}}

.maplibregl-ctrl-bottom-right{bottom:var(--sab)}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>

const clusterMarkers = new Map();
function updateClusters() {
  if (!map.getSource("inv") || !map.isSourceLoaded("inv")) return;
  const seen = new Set();
  for (const f of map.querySourceFeatures("inv")) {
    const p = f.properties;
    if (!p.cluster) continue;
    const id = p.cluster_id;
    if (seen.has(id)) continue;
    seen.add(id);
    let m = clusterMarkers.get(id);
    if (!m) {
      const el = document.createElement("button");
      el.className = "cl";
      const n = p.point_count, size = Math.round(28 + Math.min(26, Math.log2(n) * 4));
      el.style.width = el.style.height = size + "px";
      el.style.fontSize = (n >= 1000 ? 11 : n >= 100 ? 12 : 14) + "px";
      el.textContent = n >= 1000 ? (n / 1000).toFixed(1) + "k" : n;
      el.setAttribute("aria-label", `${n} invaders here, zoom in`);
      if (p.live / n < .35) el.classList.add("mostly-gone");
      el.addEventListener("click", async ev => {
        ev.stopPropagation();
        const src = map.getSource("inv");
        const z = await new Promise((res, rej) => {
          const r = src.getClusterExpansionZoom(id, (err, zz) => err ? rej(err) : res(zz));
          if (r && typeof r.then === "function") r.then(res, rej);
        });
        map.easeTo({center: f.geometry.coordinates, zoom: Math.min(z + .3, 18)});
      });
      m = new maplibregl.Marker({element: el}).setLngLat(f.geometry.coordinates);
      clusterMarkers.set(id, m);
    }
    if (!m._added) { m.addTo(map); m._added = true; }
  }
  for (const [id, m] of clusterMarkers) if (!seen.has(id)) { m.remove(); m._added = false; clusterMarkers.delete(id); }
}

map.on("idle", updateClusters);

function distM(a, b) {

  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));

/* ---------- the blue dot ---------- */
let me = null;            // {lat,lng,acc,t}
let heading = null, headingLive = false;
let mode = "off";         // off | follow | heading
let watchId = null, firstFix = true;
const meEl = document.createElement("div");
meEl.className = "me";
meEl.innerHTML = `<div class="me-cone"></div><div class="me-halo"></div><div class="me-dot"></div>`;
const meMarker = new maplibregl.Marker({element: meEl, rotationAlignment: "map", pitchAlignment: "map"});

const ICONS = {
  off: `<path d="M20.5 3.5 3.8 10.6c-.6.3-.5 1.2.1 1.3l7.1 1.3 1.3 7.1c.1.7 1 .8 1.3.1L20.5 3.5Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>`,
  follow: `<path d="M20.5 3.5 3.8 10.6c-.6.3-.5 1.2.1 1.3l7.1 1.3 1.3 7.1c.1.7 1 .8 1.3.1L20.5 3.5Z" fill="currentColor"/>`,
  heading: `<path d="M12 2.5 5 21l7-4 7 4-7-18.5Z" fill="currentColor"/>`,
  busy: `<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="36 14" stroke-linecap="round"/>`
};
function setMode(m) {
  mode = m;
  $("#locIcon").innerHTML = ICONS[watchId != null && !me ? "busy" : m];
  $("#locate").classList.toggle("busy", watchId != null && !me);
  $("#locate").setAttribute("aria-label", m === "off" ? "Show my location" : m === "follow" ? "Follow my heading" : "Stop following");
  if (m !== "heading" && map.getBearing() !== 0 && m === "off") {/* keep user's rotation */}
}
setMode("off");

function accuracyGeo() {
  if (!me || !me.acc) return {type: "FeatureCollection", features: []};
  const pts = [], n = 64, r = me.acc, lat = me.lat * Math.PI / 180;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 2 * Math.PI;
    pts.push([me.lng + (r * Math.sin(a)) / (111320 * Math.cos(lat)), me.lat + (r * Math.cos(a)) / 110540]);
  }

function onPosition(p) {
  const c = p.coords;
  me = {lat: c.latitude, lng: c.longitude, acc: c.accuracy, t: Date.now()};
  meMarker.setLngLat([me.lng, me.lat]);
  if (!meMarker._map) meMarker.addTo(map);
  meEl.classList.remove("stale");
  if (c.heading != null && !isNaN(c.heading) && c.speed > 1 && !headingLive) setHeading(c.heading);
  map.getSource("acc")?.setData(accuracyGeo());
  if (firstFix) {
    firstFix = false;
    setMode(mode === "off" ? "follow" : mode);
    map.flyTo({center: [me.lng, me.lat], zoom: Math.max(map.getZoom(), 16), speed: 1.6});
  } else if (mode !== "off") {
    map.easeTo({center: [me.lng, me.lat], duration: 600, ...(mode === "heading" && heading != null ? {bearing: heading} : {})});
  } else setMode("off");
  if (sheetFor?.type === "near" && (!onPosition.last || Date.now() - onPosition.last > 8000)) { onPosition.last = Date.now(); openNearby(); }
}
function onPosError(err) {
  watchId != null && navigator.geolocation.clearWatch(watchId);
  watchId = null; setMode("off");
  toast(err.code === 1 ? "Location is off for this site. Turn it on in your browser settings." :
        location.protocol === "file:" ? "Location needs the page to be served over https." : "Couldn’t get your location. Try again outside or near a window.");
}
function startTracking(nextMode = "follow") {
  if (!("geolocation" in navigator)) { toast("This browser can’t share your location."); return; }
  if (watchId == null) {
    firstFix = !me;
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
  }
  setMode(nextMode);
  if (me) map.flyTo({center: [me.lng, me.lat], zoom: Math.max(map.getZoom(), 16), speed: 1.6, ...(nextMode === "heading" && heading != null ? {bearing: heading} : {bearing: 0})});
}

/* compass */
let lastHeadingEase = 0;
function setHeading(h) {
  heading = h;
  meEl.classList.add("has-heading");
  meMarker.setRotation(h);
  if (mode === "heading" && Date.now() - lastHeadingEase > 120) {
    lastHeadingEase = Date.now();

  }
}
function onOrient(e) {

let compassOn = false;

    }
  } catch { return false; }
  window.addEventListener("ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation", onOrient, true);
  compassOn = true;
  return true;
}

$("#locate").onclick = async () => {
  if (mode === "off") { startTracking("follow"); startCompass(); }
  else if (mode === "follow") {
    const ok = await startCompass();
    if (ok) { setMode("heading"); if (heading != null) map.rotateTo(heading, {duration: 400}); }
    else toast("Compass isn’t available on this device.");
  } else { setMode("follow"); map.rotateTo(0, {duration: 400}); }
};
map.on("dragstart", e => { if (e.originalEvent && mode !== "off") setMode("off"); });
map.on("rotatestart", e => { if (e.originalEvent && mode === "heading") setMode("follow"); });
setInterval(() => { if (me && Date.now() - me.t > 60000) meEl.classList.add("stale"); }, 10000);

/* Resume location silently if it was already granted */
try { navigator.permissions?.query({name: "geolocation"}).then(s => {
  if (s.state === "granted") {
    firstFix = !hash.lat; // don't yank the view away from a deep link
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
    if (hash.lat) setMode("off");
  }
}).catch(() => {}); } catch {}

/* Open an invader by #id=PA_1234 */
if (hash.id && BY_ID.has(decodeURIComponent(hash.id))) map.once("load", () => openInvader(BY_ID.get(decodeURIComponent(hash.id))));
};

/* Load MapLibre: v4 needs WebGL2, older browsers/GPUs get v3 (WebGL1). Two CDNs in case one is blocked. */
(async () => {
  const probe = document.createElement("canvas");
  let gl2 = false, gl1 = false;
  try { gl2 = !!probe.getContext("webgl2"); } catch {}
  if (!gl2) try { gl1 = !!(probe.getContext("webgl") || probe.getContext("experimental-webgl")); } catch {}
  if (!gl2 && !gl1) { showFatal("This browser can’t draw the map", "WebGL is turned off or unsupported. Try another browser, or turn on hardware acceleration in your browser settings."); return; }
  const ver = gl2 ? "4.7.1" : "3.6.2";
  const cdns = [`https://cdn.jsdelivr.net/npm/maplibre-gl@${ver}/dist/`, `https://unpkg.com/maplibre-gl@${ver}/dist/`];
  const load = (tag, attrs) => new Promise((res, rej) => {
    const el = Object.assign(document.createElement(tag), attrs, {onload: res, onerror: rej});
    el.crossOrigin = "anonymous"; document.head.appendChild(el);
  });
  for (const base of cdns) {
    try {
      await load("script", {src: base + "maplibre-gl.js"});
      load("link", {rel: "stylesheet", href: base + "maplibre-gl.css"}).catch(() => {});
      break;
    } catch {}
  }
  if (!window.maplibregl) { showFatal("Couldn’t load the map library", "Check your connection, or whether a content blocker is blocking cdn.jsdelivr.net and unpkg.com."); return; }
  window.startApp();
})();
</script>
